# Secret scan for this public data repository (framework roadmap P0-03.6).
# Hand-kept: the daily sync never writes .github/. Two checks, both read-only:
#   1. gitleaks with its default rules over the pushed commits;
#   2. the framework's config/secret-patterns.txt (one ERE per line), the same
#      file the sync's pre-commit scan, weekly-gate Step 6d and the harness hook
#      read. It is fetched from the framework repository, not copied here, so
#      there is one pattern list. A hit names files only; it never prints a line.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  pattern-file:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shimo4228/contemplative-agent
          path: .framework
          persist-credentials: false
          sparse-checkout: config/secret-patterns.txt
          sparse-checkout-cone-mode: false
      - name: Search the tree for secret-shaped values
        run: |
          set -u
          hits=$(git grep -I -l -E -f .framework/config/secret-patterns.txt -- . ':!.framework') && rc=0 || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::the scan could not run (git grep exit $rc)"
            exit 1
          fi
          if [ -n "$hits" ]; then
            echo "::error::secret-shaped values in:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "no secret-shaped values"
